# Snapcraft only looks for snap/snapcraft.yaml under the project root, and the
# build container only sees the project root. Build from the repository root
# with snap/ symlinked here (scripts/build-packages.sh snap and release.yml do
# this), so every path below is relative to the repository root.
name: apk-manager
title: ApkManager
summary: Inspect Android APK package contents on Linux
description: |
  ApkManager is a native GTK 4 / Libadwaita desktop application for reading
  Android APK files. It lists raw archive contents instantly and uses Apktool
  to decode manifests, resources, and smali for deeper inspection.

  Java 17+ is bundled for Apktool decode. Raw archive listing works without
  invoking Java.

version: '0.2.0'
# core24's gnome extension provides GNOME 46 (GTK 4.14, libadwaita 1.5).
# core22 only has libadwaita 1.1, which cannot build Adw.Dialog.
base: core24
grade: devel
confinement: strict
license: GPL-3.0-or-later
platforms:
  amd64:
  arm64:

apps:
  apk-manager:
    command: bin/apk-manager-launch
    extensions: [gnome]
    plugs:
      - home
      - network
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - removable-media
    desktop: usr/share/applications/com.github.ApkManager.desktop
    common-id: com.github.ApkManager

parts:
  launcher:
    plugin: dump
    source: build/snap/local/bin
    organize:
      apk-manager-launch: bin/apk-manager-launch

  apk-manager:
    after: [launcher]
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - --libdir=lib
    source: .
    source-type: local
    build-packages:
      - valac
      - libgtksourceview-5-dev
      - libjson-glib-dev
      - libgee-0.8-dev
      - libarchive-dev
      - curl
      - desktop-file-utils
      - libglib2.0-bin
    stage-packages:
      - openjdk-17-jre-headless
      - libgee-0.8-2
      - libarchive13t64

layout:
  /usr/lib/apk-manager:
    bind: $SNAP/usr/lib/apk-manager
