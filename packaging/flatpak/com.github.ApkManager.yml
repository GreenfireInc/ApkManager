app-id: com.github.ApkManager
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17
command: apk-manager

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.FileChooser
  - --env=JAVA_HOME=/app/jre
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin

modules:
  - name: jre
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/openjdk17/bin
    build-commands:
      - cp -a /usr/lib/sdk/openjdk17 /app/jre

  - name: apk-manager
    buildsystem: meson
    build-options:
      append-path: /usr/lib/sdk/openjdk17/bin
    config-opts:
      - --prefix=/app
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - build
          - dist
      # Flatpak builds have no network, so fetch-apktool.sh cannot download it.
      - type: file
        url: https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar
        sha256: 7956eb04194300ce0d0a84ad18771eebc94b89fb8d1ddcce8ea4c056818646f4
        dest: third_party/apktool
        dest-filename: apktool_2.9.3.jar
